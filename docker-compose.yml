However, since this project does not have a backend or database, and uses Supabase for authentication, the `docker-compose.yml` can be simplified to:

```yml
version: '3'

services:
  frontend:
    build: ./frontend
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    healthcheck:
      test: ["curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
```