```yml
name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          npm install

      - name: Linting
        run: |
          npm run lint

      - name: Run tests
        run: |
          npm run test

      - name: Build Docker image
        run: |
          docker build -t build-calculator .

      - name: Deploy frontend to Vercel (main branch only)
        if: github.event.branch == 'main'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npm run deploy:vercel

      - name: Deploy backend to Render (main branch only)
        if: github.event.branch == 'main'
        env:
          RENDER_TOKEN: ${{ secrets.RENDER_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          npm run deploy:render
```